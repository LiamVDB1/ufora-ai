[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ufora-ai"
version = "1.0.2"
description = "Unofficial read-only CLI and MCP integration for UGent Ufora (D2L Brightspace)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Liam Van den Broeck" },
]
keywords = ["ugent", "ufora", "brightspace", "d2l", "mcp", "education", "cli", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]
dependencies = [
  "click==8.5.0",
  "d2l-cli[login]==0.3.0",
  "fonttools==4.65.0",
  "mcp==2.2.0",
  "playwright==1.62.0",
  "pypdf==6.18.1",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.urls]
Homepage = "https://github.com/LiamVDB1/ufora-ai"
Repository = "https://github.com/LiamVDB1/ufora-ai"
Issues = "https://github.com/LiamVDB1/ufora-ai/issues"
Documentation = "https://github.com/LiamVDB1/ufora-ai/tree/main/docs"

[project.scripts]
ufora = "ufora_cli.cli:cli"
ufora-mcp = "ufora_cli.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ufora_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
